{% extends "admin/change_list.html" %}

{% block search %}
  <div class="inventory-status-tabs">
    {% for tab in inventory_status_tabs %}
      <a class="{% if tab.active %}active{% endif %}" href="{{ tab.url }}">{{ tab.label }}</a>
    {% endfor %}
  </div>
  <style>
    .inventory-status-tabs {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin: 0 0 12px;
    }
    .inventory-status-tabs a {
      background: var(--button-bg);
      border-radius: 15px;
      color: var(--button-fg);
      font-size: 11px;
      font-weight: 700;
      line-height: 16px;
      padding: 6px 12px;
      text-transform: uppercase;
    }
    .inventory-status-tabs a.active {
      background: var(--primary);
    }
  </style>
  {{ block.super }}
{% endblock %}
